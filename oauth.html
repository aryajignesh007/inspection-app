<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Inspection App – Google sign-in</title>
<style>body{font:16px system-ui,-apple-system,sans-serif;background:#1a237e;color:#fff;text-align:center;padding:40px 20px}a{display:inline-block;margin-top:24px;background:#fff;color:#1a237e;padding:14px 22px;border-radius:10px;font-weight:700;text-decoration:none}</style></head>
<body><h2>Inspection App</h2><p id="m">Finishing Google sign-in… / સાઇન-ઇન પૂર્ણ થાય છે…</p><a id="back" href="#" style="display:none">Return to Inspection App / એપમાં પાછા જાઓ</a>
<script>
/* Receives Google's OAuth reply (token in the #fragment – never sent to any server) and hands it to the app.
   state "app.*" = Android app (custom scheme), "web.*" = browser / iPhone home-screen app (same site). */
(function () {
  var f = location.hash.slice(1), p = new URLSearchParams(f), st = p.get('state') || '', a = document.getElementById('back'), m = document.getElementById('m');
  history.replaceState(null, '', location.pathname);   // remove the token from the address bar
  if (!p.get('access_token')) { m.textContent = 'Sign-in was not completed: ' + (p.get('error') || 'no token') + '. Please go back and try again.'; return; }
  if (st.indexOf('app.') === 0) {
    var url = 'in.gujarat.excise.batti://oauth#' + f;
    a.href = url; a.style.display = 'inline-block'; m.textContent = 'Signed in ✓ Opening the app… / એપ ખુલે છે…';
    location.href = url;
  } else {
    try { var d = localStorage.getItem('district'); localStorage.setItem((d && d !== 'surat' ? d + ':' : '') + 'sync.pendingFragment', f); } catch (e) {}
    location.replace('./index.html#sync');
  }
})();
</script></body></html>
